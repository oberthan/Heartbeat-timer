services:
  - type: web
    name: heartbeat-countdown
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # To keep settings and the uploaded track across restarts, use an instance type that supports a disk, then add:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and set the environment variable DATA_DIR=/var/data

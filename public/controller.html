<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartbeat Controller</title>
<style>
  :root { --bg:#121212; --panel:#1c1c1c; --fg:#d0d0d0; --dim:#888; --accent:#c0392b; --ok:#3aa655; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:18px 0 6px; }
  .card { background:var(--panel); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .row { display:grid; grid-template-columns:1fr 84px; gap:2px 10px; align-items:center; margin-bottom:8px; }
  .row label { grid-column:1/3; font-size:13px; color:var(--dim); }
  input[type=range] { width:100%; }
  input[type=number], input[type=password], textarea { width:100%; background:#000; color:var(--fg); border:1px solid #333; border-radius:4px; padding:6px 8px; font:inherit; }
  textarea { height:90px; font:12px ui-monospace,monospace; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #444; padding:12px 18px; border-radius:6px; font:inherit; cursor:pointer; margin:0 8px 8px 0; }
  button.go { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
  button.stop { background:var(--accent); border-color:var(--accent); color:#fff; }
  #status { font-size:14px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#555; margin-right:6px; }
  .dot.on { background:var(--ok); }
  #msg { color:#e6a23c; min-height:1.4em; font-size:13px; }
  .inline { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .inline input { width:90px; }
</style>
</head>
<body>
<main>
  <h1>Heartbeat controller</h1>

  <div class="card">
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
    <div id="msg"></div>
    <div class="row" style="margin-top:8px"><label>Control password</label><input type="password" id="pw" style="grid-column:1/3" autocomplete="current-password"></div>
    <div class="inline">
      <span>Start in</span><input type="number" id="delay" value="10" min="0" max="600"><span>seconds</span>
    </div>
    <p style="margin:10px 0 0">
      <button class="go" id="btnStart">Start countdown</button>
      <button class="stop" id="btnStop">Stop</button>
    </p>
    <div style="color:var(--dim);font-size:13px">Open <a href="display.html" style="color:#8ab4f8" target="_blank">/display.html</a> on the room screen and tap it once to arm it.</div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Import settings from the plugin</h2>
    <div style="color:var(--dim);font-size:13px;margin-bottom:6px">Run <code>Export_Heartbeat_Settings.lua</code> in REAPER, then paste the result here.</div>
    <textarea id="imp" placeholder='{"dur":45,"bpm0":55,...}'></textarea>
    <p style="margin:8px 0 0"><button id="btnImport">Import &amp; send to server</button></p>
  </div>

  <div class="card" id="controls"></div>
</main>
<script src="common.js"></script>
<script>
let P = defaultSettings(), ws, wsOpen = false, lastLocalEdit = 0, sendTimer = null;
const $ = id => document.getElementById(id);
const pw = $('pw'); try { pw.value = localStorage.getItem('hbpw') || ''; } catch {}
pw.onchange = () => { try { localStorage.setItem('hbpw', pw.value); } catch {} };

// ---------- controls ----------
const inputs = {};
const ctl = $('controls');
for (const d of DEFS) {
  if (d[1] === null) { const h = document.createElement('h2'); h.textContent = d[0]; ctl.appendChild(h); continue; }
  const [id, label, def, min, max, step] = d;
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label><input type=range min=${min} max=${max} step=${step}><input type=number min=${min} max=${max} step=${step}>`;
  ctl.appendChild(row);
  const [r, n] = row.querySelectorAll('input');
  inputs[id] = [r, n];
  const set = v => { v = parseFloat(v); if (isNaN(v)) return; P[id] = v; r.value = v; n.value = v; lastLocalEdit = Date.now(); queueSend(); };
  r.oninput = () => set(r.value); n.onchange = () => set(n.value);
}
function showSettings() { for (const id in inputs) { inputs[id][0].value = P[id]; inputs[id][1].value = P[id]; } }
showSettings();

function queueSend() { clearTimeout(sendTimer); sendTimer = setTimeout(() => send({ type: 'set', settings: P }), 250); }
function send(m) {
  if (!wsOpen) { $('msg').textContent = 'Not connected.'; return; }
  ws.send(JSON.stringify({ ...m, password: pw.value }));
}

// ---------- websocket ----------
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { wsOpen = true; ws.send(JSON.stringify({ type: 'hello', role: 'controller' })); };
  ws.onclose = () => { wsOpen = false; $('statusText').textContent = 'Disconnected, retrying…'; $('dot').className = 'dot'; setTimeout(connect, 1500); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'error') { $('msg').textContent = m.error; return; }
    if (m.type !== 'state') return;
    $('msg').textContent = '';
    if (Date.now() - lastLocalEdit > 900) { P = cleanSettings(m.settings); showSettings(); }
    $('dot').className = 'dot on';
    let t = m.run.running ? 'RUNNING' : 'Idle';
    if (m.run.running && m.run.startServerMs > m.serverNow) t = 'Starting in ' + Math.ceil((m.run.startServerMs - m.serverNow) / 1000) + 's';
    $('statusText').textContent = `${t} · ${m.displays} display(s), ${m.armed} armed`;
  };
}
connect();
setInterval(() => { if (wsOpen) ws.send(JSON.stringify({ type: 'hello', role: 'controller' })); }, 1000);

// ---------- buttons ----------
$('btnStart').onclick = () => { send({ type: 'set', settings: P }); send({ type: 'start', delaySec: parseFloat($('delay').value) || 0 }); };
$('btnStop').onclick = () => send({ type: 'stop' });
$('btnImport').onclick = () => {
  try {
    const obj = JSON.parse($('imp').value.trim());
    P = cleanSettings(obj, P); showSettings(); lastLocalEdit = Date.now();
    send({ type: 'set', settings: P });
    $('msg').textContent = 'Imported.';
  } catch { $('msg').textContent = 'Could not read that - paste the JSON line the script printed.'; }
};
</script>
</body>
</html>
